name: mac

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: ./scripts/fetch-ffmpeg.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm typecheck
      - run: pnpm test

  # The app for download, for Apple silicon, signed with the same release certificate as Tinysnap
  # and Tinypen: a copy installs only an update signed exactly as itself. Nothing is released from here.
  package:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Release signing identity
        env:
          IDENTITY: ${{ secrets.MAC_SIGNING_P12 }}
          PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          [ -n "$IDENTITY" ] || { echo "No MAC_SIGNING_P12 secret: store the release identity in this repo's secrets." >&2; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$IDENTITY" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - run: ./scripts/fetch-ffmpeg.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles app
      - run: ./scripts/sign-mac.sh src-tauri/target/release/bundle/macos/Mediamorph.app
      - run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Mediamorph.app Mediamorph-mac.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Mediamorph-mac
          path: Mediamorph-mac.zip
          retention-days: 14

  # The debug build converting a clip by itself on a real Mac desktop, with the ffmpeg inside it.
  e2e:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: ./scripts/fetch-ffmpeg.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug --bundles app
      - run: bash scripts/e2e-convert.sh src-tauri/target/debug/bundle/macos/Mediamorph.app
